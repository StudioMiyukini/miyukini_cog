# MAIA-LLM — Service d'inférence GGUF local pour l'écosystème COG.
# Rust pur sauf llama.cpp (moteur tenseur C — inévitable pour GGUF multi-GPU).
# API OpenAI-compatible + gestion modèles + streaming SSE.

[package]
name = "maia-llm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MAIA-LLM — Service d'inférence GGUF local (llama.cpp + Rust)"

[[bin]]
name = "maia-llm"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda   = ["llama-cpp-2/cuda"]
rocm   = ["llama-cpp-2/rocm"]
metal  = ["llama-cpp-2/metal"]

[dependencies]
# HTTP server
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs"] }

# HTTP client (fallback health probe)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Sérialisation
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
toml        = "0.8"

# Logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# Middleware HTTP
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower      = { version = "0.5", features = ["util"] }

# Inférence GGUF — SEULE dépendance C (llama.cpp tensor engine) — version via workspace
llama-cpp-2.workspace = true

# Hash content-addressed (store)
sha2 = "0.10"
hex  = "0.4"

# Streaming async
futures      = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"

# Génération ID requête
rand = "0.8"

[lints]
workspace = true
