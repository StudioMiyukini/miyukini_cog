# Cibles de fuzzing de l'installateur de modèles du canal officiel de maia-llm (C-26) — cargo-fuzz, nightly.
# Hors du workspace (table [workspace] propre) : les builds normaux l'ignorent.
# Le code éprouvé est celui de la crate partagée `maia-modeles` (fonctionnalité
# `canal`), sans le moteur d'inférence de maia-llm.
# Lancement : cd apps/maia-llm/fuzz && cargo +nightly fuzz run artefact_mmia
# Corpus initial : cargo run --example generer_graines (stable) → seeds/<cible>/.
[package]
name = "maia-llm-canal-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
maia-modeles = { path = "../../../crates/maia-modeles", features = ["canal"] }
miyusceau = { path = "../../../crates/miyusceau" }
sha2 = "0.10"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "artefact_mmia"
path = "fuzz_targets/artefact_mmia.rs"
test = false
doc = false
bench = false
