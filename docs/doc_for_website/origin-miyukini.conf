limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

# ═══════════════════════════════════════════════════════════════════
# HTTP → HTTPS redirect (domaine principal + tous les sous-domaines)
# ═══════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name 46.202.129.65 miyukini.com origin.miyukini.com *.miyukini.com;
    
    location /.well-known/acme-challenge/ { 
        root /var/www/html; 
    }

    location / { 
        return 301 https://$host$request_uri; 
    }
}

# ═══════════════════════════════════════════════════════════════════
# Domaine principal : miyukini.com / origin.miyukini.com / IP directe
# ═══════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name 46.202.129.65 miyukini.com origin.miyukini.com;
    
    # Let's Encrypt wildcard (voir section 6.4 du guide Hostinger). Fallback : /etc/miyukini/tls/origin.crt
    ssl_certificate     /etc/letsencrypt/live/miyukini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyukini.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Documentation statique - PRIORITAIRE
    location /docs/ {
        alias /var/www/docs/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }
    
    location /docs {
        return 301 /docs/;
    }

    # Racine redirige vers la documentation
    location = / {
        return 301 /docs/;
    }

    # Admin panel
    location /admin {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=admin_login burst=5 nodelay;
    }

    # Service Origin (API, etc.) - tout le reste
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ═══════════════════════════════════════════════════════════════════
# Sous-domaines COG : xxx.miyukini.com → proxy vers Origin WebServer
# Origin lit le Host header et route vers le COG correspondant.
#
# Prérequis :
#   - DNS wildcard : *.miyukini.com → 46.202.129.65
#   - Certificat wildcard Let's Encrypt :
#     certbot certonly --manual --preferred-challenges dns \
#       -d "miyukini.com" -d "*.miyukini.com"
#
# Le bloc server_name du domaine principal (ci-dessus) a priorité
# sur ce wildcard pour miyukini.com et origin.miyukini.com.
# ═══════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name *.miyukini.com;

    # Même certificat Let's Encrypt wildcard que le bloc principal.
    ssl_certificate     /etc/letsencrypt/live/miyukini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miyukini.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Tout le trafic est envoyé au WebServer d'Origin qui route par Host header.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
