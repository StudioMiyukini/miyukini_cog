# Miyukini COG Bridge — Connexion Android ↔ COG Host.
# Modes : SSH tunnel, LAN (appareil appairé) ; authentification par passeport
# d'appareil + visa + preuve de possession (plus de jeton au porteur).
# Compile pour desktop (tests) et Android (mobile).

[package]
name = "miyukini-cog-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bridge de connexion entre Central Mobile et le COG Host (SSH, Whitelist, API Key)"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }

# SSH tunnel (pur Rust, compile pour Android)
russh = "0.48"
russh-keys = "0.48"

# HTTP client (mode LAN)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (crates éprouvées uniquement, C-24) — clé ed25519 SSH + E2E v2 (R-019) :
# identité ed25519 signant le handshake, X25519 éphémère, HKDF-SHA256,
# XChaCha20-Poly1305 à nonce aléatoire, effacement des secrets (C-25).
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
zeroize = "1"
rand = "0.8"

# Identité signée (sortie du lot 2) : passeport, visa, preuve de possession,
# requêtes signées — pur Rust, portable Android.
miyauth = { path = "../miyauth", features = ["http"] }
miyusceau = { path = "../miyusceau" }
central-remote-protocol = { path = "../central-remote-protocol" }

# Logging
tracing = "0.1"

# Utilities
hex = "0.4"
thiserror = "2"
chrono = "0.4"

[lints]
workspace = true
