# @id: miyualicia_cores_gate_crate_config
# @do: declare_miyualicia_cores_gate_crate
# @layer: 7
# @human: Crate miyualicia-cores-gate — implémentation BorderGuard du trait CoreGate du dispatcher Alicia.

[package]
name = "miyualicia-cores-gate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Alicia ↔ BorderGuard — implémentation concrète du trait CoreGate qui consulte BoundaryRegistry + TrustLevelClassifier avant d'autoriser une exécution hors-limites Alicia."

[dependencies]
miyualicia-dispatcher = { path = "../miyualicia-dispatcher" }
miyualicia-skills     = { path = "../miyualicia-skills" }
borderguard           = { path = "../borderguard" }

async-trait = "0.1"
serde_json  = "1"
tracing     = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
items_after_statements = "allow"
