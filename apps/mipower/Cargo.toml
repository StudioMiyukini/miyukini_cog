[package]
name          = "mipower"
version       = "0.1.0"
edition       = "2021"
description   = "MIPOWER — Miyukini Implementation Protocol Oriented Workflow Editor & Reviewer"
authors       = ["Miyukini Contributors"]
license       = "MIT OR Apache-2.0"

[[bin]]
name = "mipower"
path = "src/main.rs"

[dependencies]
axum          = { version = "0.8" }
tokio         = { version = "1", features = ["full"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
rusqlite      = { version = "0.32", features = ["bundled"] }
notify-debouncer-mini = "0.4"
tower-http    = { version = "0.6", features = ["fs", "cors"] }
anyhow        = "1"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util    = { version = "0.7", features = ["io"] }
futures       = "0.3"

[dev-dependencies]
tempfile      = "3"
