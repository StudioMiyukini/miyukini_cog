[package]
name = "miyualicia"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Orchestrateur central Alicia Home Assistante — connecte devices, MQTT, HTTP, NLU, wake word, commandes."

[dependencies]
miyualicia-devices    = { path = "../miyualicia-devices" }
miyualicia-mqtt       = { path = "../miyualicia-mqtt" }
miyualicia-http       = { path = "../miyualicia-http" }
miyualicia-skills     = { path = "../miyualicia-skills" }
miyualicia-memory     = { path = "../miyualicia-memory" }
miyualicia-dispatcher = { path = "../miyualicia-dispatcher" }

tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
reqwest    = { version = "0.12", features = ["json"] }
thiserror  = "2"
tracing    = "0.1"
chrono     = { version = "0.4", features = ["serde"] }
uuid       = { version = "1", features = ["v4", "serde"] }
regex      = "1"

[features]
default = []
# Expose `CapabilitiesRuntime::new_with_bypass_gate` (BypassCoreGate).
# Tests / dev uniquement, jamais en production (K-16).
dev-bypass = []

[dev-dependencies]
# Active `dev-bypass` pour les tests d'intégration (tests/*.rs).
miyualicia = { path = ".", features = ["dev-bypass"] }
tokio = { version = "1", features = ["full", "test-util"] }
axum = "0.8"
miyustt = { path = "../miyustt" }
miyutts = { path = "../miyutts" }
miyualicia-cores-gate = { path = "../miyualicia-cores-gate" }
borderguard = { path = "../borderguard" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
