[package]
name = "jaybureau"
version = "0.1.0"
edition = "2021"
description = "Jay Bureau — hub lanceur de la suite bureautique collaborative"
authors = ["Miyukini Contributors"]
license = "LicenseRef-Miyukini-Dual"

[[bin]]
name = "jaybureau"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.5", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

jaybureau-core = { path = "../../../crates/jaybureau-suite/jaybureau-core" }
miyukini-connect = { path = "../../../crates/miyukini-connect" }
miyuki-ui-tokens = { path = "../../../crates/miyuki-ui-tokens" }

[lints]
workspace = true
