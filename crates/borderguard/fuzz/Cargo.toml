# Cibles de fuzzing de borderguard (EX-10, C-26) — cargo-fuzz, nightly.
# Hors du workspace (table [workspace] propre) : les builds normaux l'ignorent.
# Lancement : cd crates/borderguard/fuzz && cargo +nightly fuzz run arrete
# Corpus initial : cargo run --example generer_graines (stable) → seeds/<cible>/.
[package]
name = "borderguard-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
borderguard = { path = ".." }
miyusceau = { path = "../../miyusceau" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "arrete"
path = "fuzz_targets/arrete.rs"
test = false
doc = false
bench = false
