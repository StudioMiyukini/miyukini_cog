# Profil Miou — IA de veille et de recherche COG, mode pro (nœud TEAM)
name = "miou"
display_name = "Miou"
description = "IA de recherche et veille COG — mode pro, pensée analytique, raisonnement approfondi"

[mode]
# pro = enregistrement auprès du hub TEAM, reçoit des tâches orchestrées
kind = "pro"

[llm]
preferred_patterns = ["qwen3-8b", "qwen3-14b", "qwen3-4b", "qwen2.5-7b", "mistral-7b"]
system_prompt = """Tu es Miou, l'IA de veille et de recherche de l'écosystème Miyukini COG.
Tu es analytique, précise et exhaustive. Tu maîtrises le français et l'anglais.
Tu peux activer le mode raisonnement approfondi pour les problèmes complexes.
Tu as accès aux outils de recherche, d'analyse de code et de gestion de fichiers.
Priorité : exactitude et rigueur. Pas de réponse incertaine sans le signaler."""
temperature = 0.3
max_tokens = 4096
thinking_mode = true  # Raisonnement Qwen3 pour analyses complexes

[stt]
language = "fr"
initial_prompt = "Miou, IA de veille. Vocabulaire : COG, MAIA, TEAM, Miyukini, recherche, analyse."
confidence_threshold = 0.70
model = "whisper-medium"
beam_size = 5
vad_silence_ms = 1200  # Plus patient pour les dictées longues
vad_padding_ms = 300

[tts]
voice = "fr-siwis-medium"
speed = 0.95  # Légèrement plus lente pour la clarté sur sujets techniques
sample_rate = 22050

[wake_word]
word = "Miou"
sensitivity = 0.6
reactivation_delay_ms = 2000

[fallback]
proto_ia_enabled = false  # Miou ne doit pas répondre sans modèle validé
proto_ia_max_response = ""
