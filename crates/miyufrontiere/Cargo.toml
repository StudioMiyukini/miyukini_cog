[package]
name = "miyufrontiere"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Câblage du lot 3 « Frontières » : Douane → Vigies, WorrySentinel → Portail et Douane (coupure de voie), Portail → CDR"

# Crate d'intégration : seul point qui connaît à la fois la Douane, les Vigies,
# WorrySentinel, le Portail et le CDR. Les crates câblés restent indépendants
# (miyuvigie sans dépendance, miyudouane sans Vigies, miyuportail sans CDR) :
# aucun cycle, aucune dépendance nouvelle tierce.
[dependencies]
borderguard = { path = "../borderguard" }
miyudouane = { path = "../miyudouane" }
miyuvigie = { path = "../miyuvigie" }
worrysentinel = { path = "../worrysentinel" }
miyuportail = { path = "../miyuportail" }
miyucdr = { path = "../miyucdr" }

[dev-dependencies]
caringnanny = { path = "../caringnanny" }
miyusceau = { path = "../miyusceau" }
ed25519-dalek = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
