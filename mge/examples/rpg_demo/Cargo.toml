description = "MGE Example — Core + RPG pack (combat, progression)"

[[bin]]
name = "rpg_demo"
path = "src/main.rs"

[dependencies]
mge-core = { path = "../../crates/mge-core" }
mge-plugin-spatial = { path = "../../crates/mge-plugin-spatial" }
