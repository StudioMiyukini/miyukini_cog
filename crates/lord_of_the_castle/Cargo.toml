# Lord of the Castle — Miyukini Survivor (Survivor + Tower Defense).
# Titre du service Miyukini Survivor. Document fondateur : docs/services/MiyukiniSurvivor/.

[package]
name = "lord_of_the_castle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lord of the Castle — Miyukini Survivor (Survivor + Tower Defense)"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "persistence", "glow"] }
egui = "0.33"
image = "0.25"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "lord_of_the_castle"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
