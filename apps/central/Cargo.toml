# Miyukini Central — Application Native Dioxus (Standalone Launcher)
# Hub de gestion des Services — installe, lance et gère les services indépendants.
# Les services sont des binaires séparés, Central orchestre leur cycle de vie.

[package]
name = "miyukini-central-native"
version = "0.2.0"
edition = "2021"
description = "Miyukini Central — Hub standalone des Services COG (Dioxus Desktop)"
authors = ["Miyukini Contributors"]
license = "LicenseRef-Miyukini-Dual"

[[bin]]
name = "miyukini-central"
path = "src/main.rs"

[dependencies]
# Dioxus pour l'UI déclarative
dioxus = { version = "0.7", features = ["desktop"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (LLM Studio, API Market, téléchargement packages)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }

# Utilities
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"

# Audio (voix Miou sur écran connexion)
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3"] }

# Archive ZIP pour les packages service (.msp)
zip = "2"

# Comparaison de versions (mises à jour) et intégrité des packages (SHA-256)
semver = "1"
sha2 = "0.10"

# Auth et profils Central (COG vierge, premier compte admin)
miyukini-central = { path = "../../crates/miyukini-central", features = ["legacy-sqlite"] }
miyukini-connect = { path = "../../crates/miyukini-connect" }

# MWS - Miyukini Webway System
miyuwebway_participant = { path = "../../crates/miyuwebway_participant" }

# Service Market (protocole + manifeste partagé Central/Origin)
miyumarket = { path = "../../crates/miyumarket" }
# Sceau v1 : ancres de confiance des éditeurs Market (CA-01)
miyusceau = { path = "../../crates/miyusceau" }
miyauth = { path = "../../crates/miyauth", features = ["http"] }
# Porte StrongFather obligatoire (K-11) : Market, lancement, secrets (ré-exporte strongfather)
bondingbrother = { path = "../../crates/bondingbrother" }
# Canal officiel (lot 4, A-006) : relevé, quarantaine, miroir du registre officiel,
# refus remontés à WorrySentinel ; secret local aléatoire (clé de la quarantaine)
miyucanal = { path = "../../crates/miyucanal" }
miyuregistre = { path = "../../crates/miyuregistre" }
worrysentinel = { path = "../../crates/worrysentinel" }
rand_core = { version = "0.6", features = ["getrandom"] }
# Installateur de modèles IA délégué (`canal_officiel::modeles`) : crate partagée
# avec maia-llm (provenance signée, artefact MMIA, installateur du canal)
maia-modeles = { path = "../../crates/maia-modeles", features = ["canal"] }

# Alicia Home Assistante — capture audio locale + détection de wake word
miyualicia-capture = { path = "../../crates/miyuvoicecapture" }
miyualicia-wakeword = { path = "../../crates/miyuwakeword" }

# Alicia — clients de services (UI dashboard productivité : météo, agenda, compta, contacts)
jaymeteo-client = { path = "../../crates/jaymeteo-client" }
jaycontact-client = { path = "../../crates/jaycontact-client" }
jaykoa-client = { path = "../../crates/jaykoa-client" }
jaykonta-client = { path = "../../crates/jaykonta-client" }

# File dialog natif (selecteur de fichiers pour MiyuCloud upload)
rfd = "0.15"

# CentralRemote — contrôle à distance depuis le navigateur
central-remote = { path = "../../crates/central-remote" }

# UI unifiee Miyukini (theme, composants, tokens)
miyuki-ui-dioxus = { path = "../../crates/miyuki-ui-dioxus" }
miyuki-ui-tokens = { path = "../../crates/miyuki-ui-tokens" }
miyukini-service-ui = { path = "../../crates/miyukini-service-ui" }

[dev-dependencies]
# Banc d'essai du canal officiel (annonces 2 sur 2, dépôt simulé)
miyucanal = { path = "../../crates/miyucanal", features = ["banc-essai"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Casts intentionnels en UI (grilles calendrier, dimensions, couleurs)
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Autres lints trop verbeux en contexte UI
ref_option = "allow"
assigning_clones = "allow"
items_after_statements = "allow"
redundant_closure = "allow"
trivially_copy_pass_by_ref = "allow"
