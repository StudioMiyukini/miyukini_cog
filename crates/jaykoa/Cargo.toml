# @id: jaykoa_crate_config
# @do: declare_jaykoa_crate_and_dependencies
# @layer: infra
# Crate JayKoa — Service officiel famille Jay (calendrier universel, agenda unifié).
# Récepteur temporel transversal : reflète, agrège et orchestre le temps.
# Dépendances : kindmother (persistance), chrono (temps).

[package]
name = "jaykoa"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["jaykoa", "agenda", "calendar", "tauri"]
categories.workspace = true
description = "JayKoa — Calendrier universel du COG, récepteur temporel transversal"

[dependencies]
kindmother = { path = "../kindmother" }
kindmother-client = { path = "../kindmother-client" }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
kindmother-db-key = { path = "../kindmother-db-key", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"

[features]
default = ["legacy-sqlite"]
# Mode legacy: accès SQLite direct (migration progressive)
legacy-sqlite = ["rusqlite"]
db-encryption = ["dep:kindmother-db-key", "rusqlite/bundled-sqlcipher"]
# Mode production: accès via KindMother uniquement
kindmother-only = []

# Note: eGUI supprimé — migration vers Tauri + React/TypeScript
# Voir docs/implementation/Miyukini - Plan Migration Tauri React TypeScript.md

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
