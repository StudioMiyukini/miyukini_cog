[package]
name = "miyurelais"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Relais NFLOG des Vigies : source de paquets netlink (NFNL_SUBSYS_ULOG) en Rust pur, décodage strict et borné, lignes MDOU| pour les Vigies, métadonnées pour l'IPS, capteur muet ⇒ voie aveugle"

# Rust pur, aucune bibliothèque C : libnetfilter_log / libnetfilter_queue sont
# GPL (interdites, C-71). Netlink par `rustix` (Apache-2.0 WITH LLVM-exception
# OR Apache-2.0 OR MIT), API sûre (aucun `unsafe` dans ce crate).
[dependencies]
miyuvigie = { path = "../miyuvigie" }
miyudouane = { path = "../miyudouane" }
borderguard = { path = "../borderguard" }
# « time » : requis par rustix 1.1 pour SO_RCVTIMEO avec « net » seul (module timespec).
rustix = { version = "1", default-features = false, features = ["std", "net", "time"] }

[dev-dependencies]
caringnanny = { path = "../caringnanny" }
worrysentinel = { path = "../worrysentinel" }

[[bin]]
name = "miyurelais"
path = "src/bin/miyurelais.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
