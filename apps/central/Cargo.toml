# Miyukini Central — Application Native Dioxus
# Hub de gestion des Services avec interface Steam-like
# Rendu natif WGPU via Blitz (pas de webview)

[package]
name = "miyukini-central-native"
version = "0.1.4"
edition = "2021"
description = "Miyukini Central — Hub natif des Services COG (Dioxus + Blitz)"
authors = ["Miyukini Contributors"]
license = "Dual"

[[bin]]
name = "miyukini-central"
path = "src/main.rs"

[dependencies]
# Dioxus pour l'UI déclarative
dioxus = { version = "0.6", features = ["desktop"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
# Audio (voix Miou sur écran connexion)
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3"] }

# Auth et profils Central (COG vierge, premier compte admin)
miyukini-central = { path = "../../crates/miyukini-central", features = ["legacy-sqlite"] }

# MWS - Miyukini Webway System
miyuwebway_participant = { path = "../../crates/miyuwebway_participant" }

# Service backends (donnees reelles via KindMother SQLite)
jayxpose = { path = "../../crates/jayxpose" }
jayfestival = { path = "../../crates/jayfestival" }
jaykonta = { path = "../../crates/jaykonta" }
jaykoa = { path = "../../crates/jaykoa" }
miyuclicker = { path = "../../crates/miyuclicker" }
lord_of_the_castle = { path = "../../crates/lord_of_the_castle" }

[features]
default = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Casts intentionnels en UI (grilles calendrier, dimensions, couleurs)
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Autres lints trop verbeux en contexte UI
ref_option = "allow"
assigning_clones = "allow"
items_after_statements = "allow"
redundant_closure = "allow"
trivially_copy_pass_by_ref = "allow"
