# MiyukiniWatch — App standalone (lancée par Central ou indépendamment).

[package]
name = "miyukiniwatch-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MiyukiniWatch — Mesure des habitudes au service de Miou (standalone)"

[dependencies]
miyukiniwatch = { path = "../../crates/miyukiniwatch" }
kindmother = { path = "../../crates/kindmother" }
miyukini-service-ui = { path = "../../crates/miyukini-service-ui" }
dioxus = { version = "0.6", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "miyukiniwatch"
path = "src/main.rs"

[lints]
workspace = true
