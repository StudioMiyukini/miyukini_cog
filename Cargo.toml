[workspace]
# Binaire principal : apps/central produit target/debug/miyukini-central.exe
default-members = ["apps/central"]
members = [
    # === Cores (strate 1-4) ===
    "crates/miyukini-kernel",
    "crates/strongfather",
    "crates/kindmother",
    "crates/kindmother-service",  # Serveur libSQL isolé
    "crates/kindmother-client",   # Client délégation IPC
    "crates/borderguard",
    "crates/caringnanny",
    "crates/masterbutler",
    "crates/bondingbrother",
    "crates/everbuddy",
    "crates/worrysentinel",
    "crates/tamr",
    "crates/logisticssteward",
    
    # === Toolkits (strate 5-6) ===
    "crates/miyusql",
    "crates/miyucalc",
    "crates/miyutext",
    "crates/miyuvalidate",
    "crates/miyulocale",
    "crates/miyuexport",
    "crates/miyujobs",
    "crates/miyauth",
    "crates/miyuweb",
    "crates/miyuclock",
    "crates/miyuforum",
    "crates/miyupm",
    "crates/miyunotify",
    "crates/miyusearch",
    "crates/miyuwebway_participant",
    "crates/miyuwebway_tracker",
    "crates/miyubilling",
    "crates/miyubooking",
    "crates/miyucms",
    "crates/miyumedia",
    "crates/miyushipping",
    "crates/miyustore",
    "crates/miyuwidgets",
    "crates/miyuinvoice",
    "crates/miyucptaledger",
    "crates/miyuexpense",
    "crates/miyutreasury",
    "crates/miyuantispam",
    "crates/miyubookmarks",
    "crates/miyucomptareports",
    "crates/miyucontacts",
    "crates/miyudeclarations",
    "crates/miyudiscovery",
    "crates/miyufeeds",
    "crates/miyuhr",
    "crates/miyumoderationforum",
    "crates/miyupolls",
    "crates/miyuposanalytics",
    "crates/miyuposinventory",
    "crates/miyuposkitchen",
    "crates/miyuposloyalty",
    "crates/miyupospayment",
    "crates/miyupossales",
    "crates/miyuprofile",
    "crates/miyusocialfeed",
    "crates/miyusocialmessaging",
    "crates/miyusocialmoderation",
    "crates/miyusocialprofile",
    "crates/miyustory",
    
    # === Services (strate 7-8) - Backend only ===
    "crates/miyukini-central",
    "crates/miyuclicker",
    "crates/jayfestival",
    "crates/jaykoa",
    "crates/jayxpose",
    "crates/jaykonta",
    
    # === Services avec UI native ===
    "crates/lord_of_the_castle",  # MiyukiniSurvivor — Dioxus + Blitz
    
    # === Applications Natives (Dioxus) ===
    "apps/central",
    
    # === Outils internes ===
    "crates/miyukini-admin",
    "tools/mip-generator",
    "tools/toolkit-skeleton",
    "tools/toolkit-registry-export",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Miyukini Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/miyukini/miyukini-kernel"
homepage = "https://github.com/miyukini/miyukini-kernel"
documentation = "https://docs.rs/miyukini-kernel"
keywords = ["kernel", "foundation", "infrastructure"]
categories = ["development-tools", "infrastructure"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"