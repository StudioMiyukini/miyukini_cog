# @id: jayfestival_crate_config
# @do: declare_jayfestival_crate_and_dependencies
# @layer: infra
# Crate JayFestival — Service officiel famille Jay (festivals, éditions, exposants, visiteurs).
# Dépendances : egui, eframe (UI), pas de logique métier en Phase 1.

[package]
name = "jayfestival"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["jayfestival", "festival", "egui", "eframe"]
categories.workspace = true
description = "JayFestival — Service festivals, éditions, exposants, visiteurs (egui/eframe)"

[dependencies]
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "persistence", "glow"] }
kindmother = { path = "../kindmother" }
miyubooking = { path = "../miyubooking" }
miyuinvoice = { path = "../miyuinvoice" }
miyunotify = { path = "../miyunotify" }
miyuclock = { path = "../miyuclock" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[[bin]]
name = "jayfestival"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
