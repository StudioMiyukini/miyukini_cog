# @id: jaykoa_crate_config
# @do: declare_jaykoa_crate_and_dependencies
# @layer: infra
# Crate JayKoa — Service officiel famille Jay (calendrier universel, agenda unifié).
# Récepteur temporel transversal : reflète, agrège et orchestre le temps.
# Dépendances : kindmother (persistance), chrono (temps).

[package]
name = "jaykoa"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["jaykoa", "agenda", "calendar", "tauri"]
categories.workspace = true
description = "JayKoa — Calendrier universel du COG, récepteur temporel transversal"

[dependencies]
# Import de la base SQLite héritée (K-13, transitoire) : lecture seule, feature `import-heritage`.
kindmother-heritage = { path = "../kindmother-heritage", optional = true }
jayrdv = { path = "../jayrdv" }
kindmother = { path = "../kindmother" }
kindmother-client = { path = "../kindmother-client" }
kindmother-db-key = { path = "../kindmother-db-key", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"

[dev-dependencies]
# Fabrique de bases héritées (tests d'import).
kindmother-heritage = { path = "../kindmother-heritage", features = ["fabrique-test"] }
# Serveur KindMother en processus pour les tests de persistance (opérateur jaykoa).
kindmother-service = { path = "../kindmother-service" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["kindmother-only"]
# Full KM : accès exclusif via KindMother (kindmother-client)
kindmother-only = []
# Import unique de la base SQLite héritée dans KindMother (outil `kindmother-import`).
# N'active pas `legacy-sqlite` (qui prendrait le pas sur le chemin KindMother) ;
# la lecture seule du fichier hérité est faite par `kindmother-heritage`.
import-heritage = ["kindmother-only", "dep:kindmother-heritage"]

# Note: eGUI supprimé — migration vers Tauri + React/TypeScript
# Voir docs/implementation/Miyukini - Plan Migration Tauri React TypeScript.md

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
