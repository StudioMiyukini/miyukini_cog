<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Allumina — Client Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── Canvas de rendu (plein écran) ─────────────────────────────────── -->
  <canvas id="game"></canvas>

  <!-- ── Écran de connexion ────────────────────────────────────────────── -->
  <div id="connect" class="screen">
    <div class="panel">
      <h1>ALLUMINA</h1>
      <p class="subtitle">Action-RPG isométrique — client web</p>
      <label>Serveur
        <input id="server" type="text" value="allumina.miyukini-home.org" />
      </label>
      <label>Nom du héros
        <input id="name" type="text" value="Héros" maxlength="16" />
      </label>
      <label>Classe</label>
      <div id="classes" class="classes">
        <button class="class-btn selected" data-class="Soldat">Soldat</button>
        <button class="class-btn" data-class="Clerc">Clerc</button>
        <button class="class-btn" data-class="MageDeGuerre">Mage de Guerre</button>
        <button class="class-btn" data-class="Archer">Archer</button>
      </div>
      <button id="login-btn" class="primary">SE CONNECTER</button>
      <div id="connect-status" class="status"></div>
    </div>
  </div>

  <!-- ── Lobby ─────────────────────────────────────────────────────────── -->
  <div id="lobby" class="screen hidden">
    <div class="panel wide">
      <h2>PARTIES</h2>
      <div id="game-list" class="game-list"></div>
      <div class="lobby-actions">
        <button id="refresh-btn">Rafraîchir</button>
        <button id="create-btn" class="primary">Créer une partie</button>
        <button id="logout-btn">Déconnexion</button>
      </div>
      <div id="lobby-status" class="status"></div>
    </div>
  </div>

  <!-- ── Popup création de partie ──────────────────────────────────────── -->
  <div id="create-modal" class="screen hidden">
    <div class="panel">
      <h2>Nouvelle partie</h2>
      <label>Nom <input id="cg-name" type="text" value="Ma partie" maxlength="24" /></label>
      <label>Joueurs max
        <select id="cg-max"><option>2</option><option selected>4</option><option>6</option><option>8</option></select>
      </label>
      <label>Difficulté
        <select id="cg-diff">
          <option value="0">Normal</option>
          <option value="1">Cauchemar</option>
          <option value="2">Enfer</option>
        </select>
      </label>
      <div class="modal-actions">
        <button id="cg-cancel">Annuler</button>
        <button id="cg-confirm" class="primary">Créer</button>
      </div>
    </div>
  </div>

  <!-- ── HUD en jeu (overlays) ─────────────────────────────────────────── -->
  <div id="hud" class="hidden">
    <!-- Barres vie / mana + niveau -->
    <div id="vitals">
      <div class="bar hp"><div id="hp-fill" class="fill"></div><span id="hp-text">100/100</span></div>
      <div class="bar mp"><div id="mp-fill" class="fill"></div><span id="mp-text">50/50</span></div>
      <div id="level-badge">Niv. 1</div>
      <div id="xp-bar"><div id="xp-fill"></div></div>
    </div>

    <!-- Infos haut -->
    <div id="topbar">
      <span id="player-count">Joueurs: 0</span>
      <span id="gold">Or: 0</span>
      <span id="ping">— ms</span>
    </div>

    <!-- Minimap -->
    <canvas id="minimap" width="160" height="160"></canvas>

    <!-- Hotbar -->
    <div id="hotbar"></div>

    <!-- Chat -->
    <div id="chat">
      <div id="chat-log"></div>
      <input id="chat-input" type="text" class="hidden" maxlength="120" placeholder="Entrée pour parler…" />
    </div>

    <!-- Aide commandes -->
    <div id="help">Clic G: déplacer · Clic D: attaquer · 1-9: skills · I: inventaire · Entrée: chat · Tab: minimap · Échap: menu</div>

    <!-- Inventaire (popup) -->
    <div id="inventory" class="hidden">
      <h3>Inventaire</h3>
      <div id="inv-grid"></div>
      <button id="inv-close">Fermer (I)</button>
    </div>

    <!-- Menu (Échap) -->
    <div id="menu" class="hidden">
      <div class="panel">
        <h2>MENU</h2>
        <button id="menu-resume" class="primary">Reprendre</button>
        <button id="menu-leave">Quitter la partie</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
