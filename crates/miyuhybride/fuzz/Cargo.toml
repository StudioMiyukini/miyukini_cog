# Cibles de fuzzing de miyuhybride (C-26) — cargo-fuzz, nightly.
# Hors du workspace (table [workspace] propre) : les builds normaux l'ignorent.
# Lancement : cd crates/miyuhybride/fuzz && cargo +nightly fuzz run contrat
# Corpus initial : cargo run --example generer_graines (stable) → seeds/<cible>/.
[package]
name = "miyuhybride-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
miyuhybride = { path = ".." }
miyuportail = { path = "../../miyuportail" }
miyusceau = { path = "../../miyusceau" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "contrat"
path = "fuzz_targets/contrat.rs"
test = false
doc = false
bench = false
