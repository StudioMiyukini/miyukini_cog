[package]
name = "jaymessage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Jay Message — messagerie chiffrée de bout en bout (Signal-like)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"

# Réutilise la crypto E2E déjà dans le bridge Android
miyukini-cog-bridge = { path = "../../miyukini-cog-bridge" }

# Reuse miyusocialmessaging pour les structures conversationnelles
miyusocialmessaging = { path = "../../miyusocialmessaging" }

# Crypto additionnelle
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2" }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[lints]
workspace = true
