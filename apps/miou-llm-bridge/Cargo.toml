# MAIA — Miyukini AI Agents — moteur IA local (STT/LLM/TTS/skills/personas).
# Anciennement miou-llm-bridge — renommé vers "maia" (S1-E01).
# Le répertoire physique reste apps/miou-llm-bridge jusqu'au prochain refactor git mv.

[package]
name = "maia"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MAIA — Miyukini AI Agents — moteur IA local (STT/LLM/TTS/skills/personas)"

[[bin]]
name = "maia"
path = "src/main.rs"

[features]
default = []

[dependencies]
# HTTP server
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "process", "net", "time"] }

# HTTP client (upstream backup : LM Studio / Ollama)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Erreurs typées (C-11) — refus SSRF / confirmations (lot 0 bis K-01..K-03)
thiserror = "2"

# Sérialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Hardware detection
sysinfo = "0.33"

# Async recursion (file_ops)
async-recursion = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CORS & middleware
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["util"] }

# Audio output — TTS playback via Piper (S1-E06)
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
hound = "3.5"

# Cryptographie (AES-256-GCM chiffrement réponses ; empreintes)
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Identifiant de nœud TEAM (hostname)
hostname = "0.4"

# Requêtes signées entrantes / sortantes (lot 2 : plus de secret partagé)
miyauth   = { path = "../../crates/miyauth", features = ["http"] }
miyusceau = { path = "../../crates/miyusceau" }

# Porte obligatoire StrongFather (K-11) : outils et administration des agents
bondingbrother = { path = "../../crates/bondingbrother" }

# IA fédérée (lot 7, EX-57..63) : Fiches, double MAIA, marquage etranger, corroboration
maia-federee = { path = "../../crates/maia-federee" }

# Mémoire de l'utilisateur (lot 7, EX-50..56) : N0–N4 sous budget, base KindMother chiffrée
maia-memoire = { path = "../../crates/maia-memoire" }

[lints]
workspace = true
