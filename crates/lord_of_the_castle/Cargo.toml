# Lord of the Castle — Miyukini Survivor (Survivor + Tower Defense).
# Titre du service Miyukini Survivor. Document fondateur : docs/services/MiyukiniSurvivor/.
# UI : Dioxus + Blitz (rendu natif WGPU), migration depuis eGUI.

[package]
name = "lord_of_the_castle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lord of the Castle — Miyukini Survivor (Survivor + Tower Defense)"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
image = "0.25"
base64 = "0.22"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
kindmother = { path = "../kindmother" }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

[[bin]]
name = "lord_of_the_castle"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
