# JayXpose — App standalone (lancée par Central ou indépendamment).

[package]
name = "jayxpose-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JayXpose — Profil exposant, catalogue produits, vitrine (standalone)"

[dependencies]
jayxpose = { path = "../../crates/jayxpose" }
kindmother = { path = "../../crates/kindmother" }
miyukini-service-ui = { path = "../../crates/miyukini-service-ui" }
dioxus = { version = "0.7", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "jayxpose"
path = "src/main.rs"

[lints]
workspace = true
