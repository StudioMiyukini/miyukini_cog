# CentralRemote — Contrôle à distance de Central depuis le navigateur.
# @id: central_remote_cargo @do: declare_central_remote_crate @role: infra @layer: toolkit
# @human: Protocole + serveur embarqué pour le contrôle à distance de Central via le portail web.

[package]
name = "central-remote"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CentralRemote — protocole et serveur embarqué pour le contrôle à distance de Central"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
central-remote-protocol = { path = "../central-remote-protocol" }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hkdf = "0.12"
# Identité signée (sortie du lot 2) : passeports d'appareil, visas, preuve de
# possession, requêtes signées (miyauth::http) ; cog_id (miyuracine).
miyauth = { path = "../miyauth", features = ["http"] }
miyusceau = { path = "../miyusceau" }
miyuracine = { path = "../miyuracine" }
# E2E mobile ↔ COG v2 (R-023) : réutilise le protocole du bridge, aucune
# primitive dupliquée ici (C-24) ; zeroize pour les secrets (C-25) ;
# thiserror pour les erreurs typées (C-11).
miyukini-cog-bridge = { path = "../miyukini-cog-bridge" }
zeroize = "1"
thiserror = "2"
hex = "0.4"
tracing = "0.1"
chrono = "0.4"
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
tokio-stream = "0.1"

# Profils Central (nom affiché du titulaire d'un appareil).
miyukini-central = { path = "../miyukini-central", features = ["legacy-sqlite"] }

[dev-dependencies]
# Test de bout en bout du WebSocket authentifié (déjà dans le graphe via central-mobile).
tokio-tungstenite = "0.24"

[lints]
workspace = true
