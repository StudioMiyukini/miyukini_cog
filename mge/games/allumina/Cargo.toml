[package]
name = "allumina"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
mge-core = { path = "../../crates/mge-core" }
mge-gameplay = { path = "../../crates/mge-gameplay" }
mge-items = { path = "../../crates/mge-items" }
# Rendering: reuse the engine's proven wgpu sprite pipeline (colored quads +
# tinting) rather than hand-rolling wgpu/winit boilerplate, per the task's
# "simplify if the GPU setup gets too complex" guidance.
mge-render = { path = "../../crates/mge-render" }
mge-content = { path = "../../crates/mge-content" }
winit = { workspace = true }
pollster = { workspace = true }

# Networking codec — only compiled with `--features netcode`.
bincode = { version = "1.3", optional = true }
# WebSocket bridge for the browser client — only with `--features webclient`.
# Lightweight sync WebSocket impl built on std::net (no async runtime pulled in).
tungstenite = { version = "0.21", optional = true }

[target.'cfg(windows)'.build-dependencies]
# Embeds the app icon + version metadata into the .exe (distributable polish).
winresource = "0.1"

[features]
default = []
# Authoritative TCP server + client (allumina.miyukini-home.org:7777).
# Implementation uses std::net + std::thread, so no extra heavy deps.
netcode = ["dep:bincode"]
# WebSocket→TCP bridge + static HTTP server feeding the browser client in
# `web/`. Re-encodes the wire protocol between JSON (browser) and bincode (TCP
# server). Pulls in `tungstenite` for the WS handshake/framing.
webclient = ["netcode", "dep:tungstenite"]

[lints]
workspace = true
