[workspace]
members = ["crates/miyukini-kernel", "crates/strongfather", "crates/kindmother", "crates/borderguard", "crates/caringnanny", "crates/masterbutler", "crates/bondingbrother", "crates/everbuddy", "crates/worrysentinel", "crates/tamr", "crates/logisticssteward", "crates/miyukini-admin", "tools/mip-generator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Miyukini Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/miyukini/miyukini-kernel"
homepage = "https://github.com/miyukini/miyukini-kernel"
documentation = "https://docs.rs/miyukini-kernel"
keywords = ["kernel", "foundation", "infrastructure"]
categories = ["development-tools", "infrastructure"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
