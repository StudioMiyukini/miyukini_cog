[package]
name = "jay-docs"
version = "0.1.0"
edition = "2021"
description = "Jay Docs — éditeur de documents collaboratif (Google Docs-like)"
authors = ["Miyukini Contributors"]
license = "LicenseRef-Miyukini-Dual"

[[bin]]
name = "jay-docs"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.5", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
yrs = "0.21"

jaybureau-core = { path = "../../crates/jaybureau-core" }
jay-collab = { path = "../../crates/jay-collab" }
miyuki-ui-tokens = { path = "../../crates/miyuki-ui-tokens" }

[lints]
workspace = true
