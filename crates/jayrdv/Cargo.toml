# Crate JayRDV — Service rendez-vous et réservation en ligne (famille Jay).
# Domaine : créneaux, ressources, rendez-vous, statuts, rappels.
# Intégration prévue : MiyuBooking (créneaux), MiyuNotify (rappels), JayKoa (agenda).

[package]
name = "jayrdv"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["jayrdv", "appointment", "booking", "reservation"]
categories.workspace = true
description = "JayRDV — Service rendez-vous et réservation en ligne du COG"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# Persistance KindMother (K-13 : KindMother seul écrivain ; EX-07 : écritures par intentions typées).
kindmother-client = { path = "../kindmother-client", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
serde_json = { version = "1", optional = true }
# Moteur du service hybride H2 (lot 5) : relève les messages du traité via le Portail, sans protocole externe (INV-H1).
miyuhybride = { path = "../miyuhybride" }
jayrdv-traite = { path = "../jayrdv-traite" }

[dev-dependencies]
# Serveur KindMother éphémère en processus (tests du store KindMother).
kindmother-service = { path = "../kindmother-service" }
kindmother-client = { path = "../kindmother-client" }
tempfile = "3"
# Test de sortie du lot 5 : façade, Portail en processus, identités fédérées.
jayrdv-facade = { path = "../jayrdv-facade" }
miyuportail = { path = "../miyuportail" }
miyauth = { path = "../miyauth", features = ["http"] }
miyusceau = { path = "../miyusceau" }

[features]
# Défaut : persistance réelle via KindMother (full KM).
default = ["kindmother-only"]
# Store en mémoire : prioritaire s'il est activé explicitement (tests, démos sans serveur).
# Aussi utilisé si aucune feature de persistance n'est activée.
memory = []
# Full KM : persistance via le service KindMother (intentions typées, lectures typées).
kindmother-only = ["dep:kindmother-client", "dep:tokio", "dep:serde_json"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
