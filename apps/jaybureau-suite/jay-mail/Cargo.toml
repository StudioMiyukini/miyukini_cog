[package]
name = "jay-mail"
version = "0.1.0"
edition = "2021"
description = "Jay Mail — client email Miyukini"
authors = ["Miyukini Contributors"]
license = "LicenseRef-Miyukini-Dual"

[[bin]]
name = "jay-mail"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.5", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"

jaymail = { path = "../../../crates/jaybureau-suite/jaymail" }

[lints]
workspace = true
