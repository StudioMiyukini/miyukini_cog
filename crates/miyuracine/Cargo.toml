[package]
name = "miyuracine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Racine COG hors ligne : sauvegarde SLIP-39 2 sur 3, clés par usage SLIP-10 (Ed25519, durcie), cérémonie de rotation (EX-24, EX-25)"

# Aucune dépendance réseau (vérifié par `tests/hors_reseau.rs`).
[dependencies]
miyusceau = { path = "../miyusceau" }
# HMAC-SHA256 / HMAC-SHA512 (SLIP-39 empreinte, SLIP-10) et PBKDF2-HMAC-SHA256
# (chiffrement Feistel SLIP-39) : RustCrypto, MIT OR Apache-2.0, déjà dans le graphe.
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# Fichier de clé chiffré (support amovible) : RustCrypto, MIT OR Apache-2.0,
# déjà dans le graphe du workspace (C-71 : aucun copyleft).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false }

# Appels système sans `unsafe` (prctl, setrlimit, mlockall, open O_NOFOLLOW,
# renameat2) : rustix, Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "mm", "process"] }

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[[bin]]
name = "miyuracine"
path = "src/bin/miyuracine.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
