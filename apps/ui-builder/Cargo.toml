# Miyukini UI Builder — Exécutable standalone pour itération rapide
# Lance uniquement la vitrine UI (pas de backend services, pas d'auth)

[package]
name = "miyukini-ui-builder"
version = "0.1.0"
edition = "2021"
description = "Standalone UI Builder — itération rapide sur les assets UI Miyukini"
authors = ["Miyukini Contributors"]
license = "LicenseRef-Miyukini-Dual"

[[bin]]
name = "ui-builder"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
