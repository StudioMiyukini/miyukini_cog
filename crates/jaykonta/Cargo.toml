[package]
name = "jaykonta"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["jaykonta", "accounting", "budget", "tauri"]
categories.workspace = true
description = "JayKonta - comptabilite COG unifiee Purse + Account"

[dependencies]
# Import de la base SQLite héritée (K-13, transitoire) : lecture seule, feature `import-heritage`.
kindmother-heritage = { path = "../kindmother-heritage", optional = true }
kindmother = { path = "../kindmother" }
kindmother-client = { path = "../kindmother-client" }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
kindmother-db-key = { path = "../kindmother-db-key", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"

[dev-dependencies]
# Fabrique de bases héritées (tests d'import).
kindmother-heritage = { path = "../kindmother-heritage", features = ["fabrique-test"] }
# Tests du chemin KindMother : serveur KindMother éphémère en processus.
kindmother-service = { path = "../kindmother-service" }
kindmother-client = { path = "../kindmother-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# K-13 : KindMother est le seul écrivain ; chemin par défaut (n'active pas rusqlite).
default = ["kindmother-only"]
kindmother-only = []
# Import unique de la base SQLite héritée dans KindMother (outil `kindmother-import`).
# N'active pas `legacy-sqlite` (qui prendrait le pas sur le chemin KindMother) ;
# la lecture seule du fichier hérité est faite par `kindmother-heritage`.
import-heritage = ["kindmother-only", "dep:kindmother-heritage"]
# HÉRITÉ (transitoire, K-13) : accès SQLite direct, retiré au lot C+ ; non défaut.
# Activé explicitement, il prend le pas sur kindmother-only (voir src/data/mod.rs).
legacy-sqlite = ["rusqlite"]
# Chiffrement de la base locale du chemin hérité uniquement.
db-encryption = ["kindmother-db-key"]

# Note: eGUI supprimé — migration vers Tauri + React/TypeScript
# Voir docs/implementation/Miyukini - Plan Migration Tauri React TypeScript.md

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
