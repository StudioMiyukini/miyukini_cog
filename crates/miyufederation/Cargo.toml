[package]
name = "miyufederation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Fédération COG — candidature hashcash, statuts invité / membre, blacklist sur preuves signées et quorum de 6, note locale, anti-éclipse, sans Origin (lot 6, EX-30..33, EX-35, EX-37, EX-38)"

# Aucune dépendance réseau : la crate décide, le transport (commérage) est ailleurs.
[dependencies]
miyusceau = { path = "../miyusceau" }
miyuracine = { path = "../miyuracine" }
miyuregistre = { path = "../miyuregistre" }
miyauth = { path = "../miyauth" }
sha2 = "0.10"
hmac = "0.12"
zeroize = "1"
thiserror = "2"

# Verrou `flock`, uid effectif, ouverture sans suivre de lien : appels
# système sans `unsafe` (le crate est `forbid(unsafe_code)`). Déjà dans le
# graphe (miyuracine, miyuportail) ; Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]

[lints]
workspace = true
