# Cibles de fuzzing de miyuregistre (EX-10, C-26) — cargo-fuzz, nightly.
# Hors du workspace (table [workspace] propre) : les builds normaux l'ignorent.
# Lancement : cd crates/miyuregistre/fuzz && cargo +nightly fuzz run entree
# Corpus initial : cargo run --example generer_graines (stable) → seeds/<cible>/.
[package]
name = "miyuregistre-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
miyuregistre = { path = ".." }
miyusceau = { path = "../../miyusceau" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "entree"
path = "fuzz_targets/entree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stockage_fichier"
path = "fuzz_targets/stockage_fichier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "miroir"
path = "fuzz_targets/miroir.rs"
test = false
doc = false
bench = false
