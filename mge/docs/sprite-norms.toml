# @id: MGE-Docs-SpriteNorms @do: document @role: back-end @layer: 2 @human: francois
#
# ============================================================================
# MGE Sprite Norms — Reference TOML
# ============================================================================
#
# This file documents the standard conventions for sprite assets, animation
# banks, and atlas packing in the Miyukini Game Engine (MGE).
#
# It is NOT loaded at runtime. It serves as a living reference for artists
# and developers.

# ============================================================================
# 1. Naming Convention
# ============================================================================
#
# All sprite frame files follow this pattern:
#
#     {entity}_{action}_{dir}_{frame:03d}.png
#
# Examples:
#     fallen_idle_s_000.png
#     fallen_idle_sw_007.png
#     hero_walk_nw_003.png
#     boss_attack_w_012.png
#
# Rules:
#   - entity:  lowercase, underscores allowed (e.g. "fallen", "dark_knight")
#   - action:  matches AnimationState variants in lowercase (idle, walk,
#              attack, hit, death, cast, special)
#   - dir:     one of the 4 RENDERED directions: s, sw, w, nw
#              (n, ne, e, se are produced by horizontal mirroring at runtime)
#   - frame:   zero-padded 3-digit frame index (000-999)

# ============================================================================
# 2. Sprite Size Classes
# ============================================================================
#
# All sprites MUST conform to one of these 5 standard sizes.
# Non-conforming sizes will be rejected by the atlas packer.

[sizes.small]
description = "Small objects: barrels, chests, potions"
width = 128
height = 128
examples = ["barrel", "chest", "potion", "gold_pile"]

[sizes.medium]
description = "Medium bipeds: fallen, zombies, small demons"
width = 128
height = 256
examples = ["fallen", "zombie", "quill_rat"]

[sizes.humanoid]
description = "Humanoid characters: player classes, NPCs, standard enemies"
width = 128
height = 384
examples = ["hero_barbarian", "hero_sorceress", "rogue_npc", "skeleton"]

[sizes.large]
description = "Large entities: sub-bosses, mounts, large demons"
width = 192
height = 384
examples = ["blood_raven", "fallen_shaman", "charsi_mount"]

[sizes.boss]
description = "Boss entities: act bosses, world bosses, mega-demons"
width = 256
height = 768
examples = ["andariel", "duriel", "diablo"]

# ============================================================================
# 3. Direction System
# ============================================================================
#
# 8 logical directions in dimetric 2:1 isometric projection.
# Only 4 are rendered as sprite art; the other 4 are mirrored at runtime.
#
#     NW   N   NE
#       \  |  /
#    W ---[o]--- E
#       /  |  \
#     SW   S   SE
#
# Rendered (artist draws these):
#   S   -- South (facing camera)
#   SW  -- South-West
#   W   -- West
#   NW  -- North-West
#
# Mirrored (flipped horizontally at runtime):
#   SE  -> mirrors SW
#   E   -> mirrors W
#   NE  -> mirrors NW
#   N   -> falls back to S (MVP limitation, no back-facing sprites)

[directions]
rendered = ["S", "SW", "W", "NW"]
mirrored = { N = "S", NE = "NW", E = "W", SE = "SW" }

# ============================================================================
# 4. Example: Fallen Animation Bank
# ============================================================================
#
# A complete example for the "fallen" enemy (Medium size, 128x256px).
# 4 rendered directions, 8 frames per Idle animation, looping.

entity_id = "fallen"

[[clips]]
state = "Idle"
direction = "S"
frame_count = 8
frame_duration_ms = 120
looping = true
atlas_start_frame = 0
# Files: fallen_idle_s_000.png .. fallen_idle_s_007.png

[[clips]]
state = "Idle"
direction = "SW"
frame_count = 8
frame_duration_ms = 120
looping = true
atlas_start_frame = 8
# Files: fallen_idle_sw_000.png .. fallen_idle_sw_007.png

[[clips]]
state = "Idle"
direction = "W"
frame_count = 8
frame_duration_ms = 120
looping = true
atlas_start_frame = 16
# Files: fallen_idle_w_000.png .. fallen_idle_w_007.png

[[clips]]
state = "Idle"
direction = "NW"
frame_count = 8
frame_duration_ms = 120
looping = true
atlas_start_frame = 24
# Files: fallen_idle_nw_000.png .. fallen_idle_nw_007.png

# ============================================================================
# 5. Atlas Packing Rules
# ============================================================================
#
# - atlas_start_frame values MUST NOT overlap between clips.
# - Frames are packed left-to-right, top-to-bottom in the atlas.
# - Atlas texture size should be a power of 2 (1024, 2048, 4096).
# - Each entity gets its own atlas file.
# - Frame indices are global within the atlas (0-based).
#
# Layout formula:
#   For a clip with atlas_start_frame = N and frame_count = F:
#   Frames occupy indices [N, N+1, ..., N+F-1] in the atlas.
#   No two clips may share the same index range.
