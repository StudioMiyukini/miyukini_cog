# @id: miyualicia_skills_crate_config
# @do: declare_miyualicia_skills_crate
# @layer: 7
# @human: Crate Alicia Skills — registre des capacités exposées par les services COG.

[package]
name = "miyualicia-skills"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Alicia Skills — découverte et registre des capacités déclarées par les services COG (manifeste JSON, dispatcher, recherche par phrase)."

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
chrono      = { version = "0.4", features = ["serde"] }
thiserror   = "2"
tracing     = "0.1"

[dev-dependencies]
tempfile    = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
items_after_statements = "allow"
