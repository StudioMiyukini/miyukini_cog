[workspace]
# Binaire principal : apps/central produit target/debug/miyukini-central.exe
default-members = ["apps/central"]
members = [
    # === Cores (strate 1-4) ===
    "crates/miyukini-kernel",
    "crates/strongfather",
    "crates/kindmother",
    "crates/kindmother-db-key",   # Dérivation clé pour SQLCipher
    "crates/kindmother-service",  # Serveur libSQL isolé
    "crates/kindmother-client",   # Client délégation IPC
    "crates/kindmother-heritage", # Import des bases SQLite héritées (transitoire, K-13)
    "crates/kindmother-import",   # CLI d'import des bases héritées (transitoire, K-13)
    "crates/borderguard",
    "crates/miyudouane",          # Douane : pare-feu nftables + IPS appliquant les arrêtés de BorderGuard, une instance par frontière (lot 3, EX-19..21, EX-29)
    "crates/caringnanny",
    "crates/masterbutler",
    "crates/bondingbrother",
    "crates/everbuddy",
    "crates/worrysentinel",
    "crates/miyuvigie",           # Vigies : capteurs IDS sous WorrySentinel (lot 3, EX-12, EX-49)
    "crates/miyuportail",         # Portail interne : voies à sens unique, MSCE, CDR, sas seccomp (lot 3, EX-44..46, EX-49)
    "crates/miyufrontiere",       # Câblage du lot 3 : Douane → Vigies, WorrySentinel → Portail + Douane, Portail → CDR (EX-12, EX-45, EX-49)
    "crates/miyuhybride",         # Services hybrides : manifeste signé H0–H3, moteur / façade / traité, façades jetables (lot 5, EX-16, EX-40..43, EX-48)
    "crates/tamr",
    "crates/logisticssteward",
    
    # === Toolkits (strate 5-6) ===
    "crates/miyuki-ui-tokens",
    "crates/miyuki-ui-dioxus",
    "crates/miyusql",
    "crates/miyucalc",
    "crates/miyutext",
    "crates/miyustt",
    "crates/miyutts",
    "crates/miyuvalidate",
    "crates/miyulocale",
    "crates/miyuexport",
    "crates/miyujobs",
    "crates/miyauth",
    "crates/miyusceau",
    "crates/miyuracine",          # Racine COG hors ligne : SLIP-39 2 sur 3, clés SLIP-10 par usage (EX-24, EX-25)
    "crates/miyucdr",             # CDR : désarmement et reconstruction de toute entrée de fichier (EX-45)
    "crates/miyuregistre",        # Registre Merkle local et fédéral : journal append-only, têtes signées, Median-Time-Past (lot 4, EX-22, EX-34)
    "crates/miyucanal",           # Canal officiel : relevé du dépôt officiel via le Portail, annonces 2 sur 2, quarantaine (lot 4, EX-01, EX-02, EX-20, EX-26)
    "crates/miyufederation",      # Fédération : candidature hashcash, statuts invité / membre, blacklist sur preuves et quorum de 6, note locale, anti-éclipse, sans Origin (lot 6, EX-30..33, EX-35, EX-37, EX-38)
    "crates/maia-federee",        # IA fédérée MAIA : Fiches signées 0x09, double MAIA, marquage etranger, corroboration (lot 7, EX-57..63)
    "crates/miyuweb",
    "crates/miyuclock",
    "crates/miyuforum",
    "crates/miyupm",
    "crates/miyunotify",
    "crates/miyusearch",
    "crates/miyuwebway_participant",
    "crates/miyuwebway_tracker",
    "crates/miyubilling",
    "crates/miyubooking",
    "crates/miyucms",
    "crates/miyumedia",
    "crates/miyushipping",
    "crates/miyustore",
    "crates/miyumarket",
    "crates/miyuwidgets",
    "crates/miyuinvoice",
    "crates/miyucptaledger",
    "crates/miyuexpense",
    "crates/miyutreasury",
    "crates/miyuantispam",
    "crates/miyubookmarks",
    "crates/miyucomptareports",
    "crates/miyucontacts",
    "crates/miyudeclarations",
    "crates/miyudiscovery",
    "crates/miyufeeds",
    "crates/miyuhr",
    "crates/miyumoderationforum",
    "crates/miyupolls",
    "crates/miyuposanalytics",
    "crates/miyuposinventory",
    "crates/miyuposkitchen",
    "crates/miyuposloyalty",
    "crates/miyupospayment",
    "crates/miyupossales",
    "crates/miyuprofile",
    "crates/miyusocialfeed",
    "crates/miyusocialmessaging",
    "crates/miyusocialmoderation",
    "crates/miyusocialprofile",
    "crates/miyustory",
    "crates/miyukini-service-ui",  # Fondations UI partagées (thème, styles)

    # === Services (strate 7-8) - Backend only ===
    "crates/miyukini-central",
    "crates/jaykoa",
    "crates/jayrdv",
    "crates/jayrdv-traite",       # Traité JayRDV (H2) : messages moteur ⇄ façade, codecs générés (lot 5, EX-42)
    "crates/jayrdv-facade",       # Façade JayRDV en Franche : API de réservation fédérée, visa + PoP, DB secondaire (lot 5, EX-41, EX-43)
    "crates/jayfaim",
    "crates/miyukinisales",
    "crates/jaykonta",
    "crates/jay1tribu",
    "crates/miyukiniwatch",
    "crates/miyukinibb",
    "crates/jaymanga",
    "crates/miyucloud",
    "crates/miyucloud-dav",

    # === MAIA — Miyukini AI Agents ===
    "crates/maia-stt",          # STT whisper.cpp — isolé de maia pour éviter conflit rustpotter/candle

    # === Alicia Home Assistante ===
    "crates/miyuvoicecapture",
    "crates/miyuwakeword",
    "crates/miyualicia-devices",
    "crates/miyualicia-mqtt",
    "crates/miyualicia-http",
    "crates/miyualicia-automations",
    "crates/miyualicia",
    "crates/miyualicia-api",
    "crates/miyualicia-skills",
    "crates/miyualicia-memory",
    "crates/maia-memoire",           # Mémoire MAIA N0–N4 (lot 7, EX-50..56)
    "crates/maia-modeles",           # Provenance signée des modèles MAIA (manifeste, artefact MMIA, installateur du canal officiel ; EX-26)
    "crates/miyualicia-dispatcher",
    "crates/miyualicia-cores-gate",
    "crates/jaykoa-client",
    "crates/jaykonta-client",
    "crates/jayrdv-client",
    "crates/jaymail-client",
    "crates/jaymessage-client",
    "crates/jaydocs-client",
    "crates/jaysheets-client",
    "crates/jayslides-client",
    "crates/jaymeteo-client",
    "crates/jaycontact-client",

    # === JayCloud — sauvegarde cloud souveraine (distinct de MiyuCloud) ===
    "crates/jaycloud",
    "crates/jaycloud-client",
    "crates/jaycloud-migrate",

    # === Applications Natives (Dioxus) ===
    "apps/central",
    "apps/central-mobile",

    # === Apps Standalone Services (lancées par Central ou indépendamment) ===
    "apps/jaykoa",
    "apps/jaykonta",
    "apps/miyukiniwatch",
    "apps/jay1tribu",
    "apps/jaymanga",
    "apps/miou-llm-bridge",
    "apps/maia-llm",
    "apps/team",
    "apps/miyukini-whisper",
    "apps/miyucloud",
    "apps/alicia-mvp",

    # === MWS Origin ===
    "apps/origin",

    # === CentralRemote — Contrôle à distance de Central ===
    "crates/central-remote-protocol",
    "crates/central-remote",

    # === COG Bridge — Connexion Android ↔ COG Host ===
    "crates/miyukini-cog-bridge",

    # === Jay Bureau — Suite bureautique collaborative ===
    # Crates fondations (jaybureau-suite/)
    "crates/jaybureau-suite/jaybureau-core",
    "crates/jaybureau-suite/jay-collab",
    "crates/jaybureau-suite/jayclub",
    "crates/jaybureau-suite/jaymail",
    "crates/jaybureau-suite/jaymessage",
    # Apps (jaybureau-suite/)
    "apps/jaybureau-suite/hub",
    "apps/jaybureau-suite/jay-docs",
    "apps/jaybureau-suite/jay-sheets",
    "apps/jaybureau-suite/jay-slides",
    "apps/jaybureau-suite/jay-formulaire",
    "apps/jaybureau-suite/jay-reunion",
    "apps/jaybureau-suite/jay-club",
    "apps/jaybureau-suite/jay-mail",
    "apps/jaybureau-suite/jay-message",

    # === COG Portal Contract — Contrat d'exposition Portal ===
    "crates/cog-portal-contract",

    # === MIPOWER — Workflow Editor ===
    "apps/mipower",

    # === COG Web Portal — Portail HTTP externe ===
    "apps/cog-web-portal",

    # === Outils internes ===
    "crates/miyukini-admin",
    "tools/mscm-generator",
    "tools/mip-configurator",
    "tools/toolkit-skeleton",
    "tools/toolkit-registry-export",
    "crates/miyukini-connect",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Miyukini Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/miyukini/miyukini-kernel"
homepage = "https://github.com/miyukini/miyukini-kernel"
documentation = "https://docs.rs/miyukini-kernel"
keywords = ["kernel", "foundation", "infrastructure"]
categories = ["development-tools", "infrastructure"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_assignments = "allow"
dead_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"

[workspace.dependencies]
# Partagé entre maia-llm et miou-llm-bridge — version unique pour éviter les conflits resolver
llama-cpp-2 = { version = "=0.1.134", features = ["sampler"] }
