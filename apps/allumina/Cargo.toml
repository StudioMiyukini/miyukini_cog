# Allumina — Action RPG 2D (Diablo-like). Moteur Bevy 2D, intégration MWS prévue.
# Document fondateur : docs/services/Allumina/.

[package]
name = "allumina"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Allumina — Action RPG 2D (Bevy 2D)"

[dependencies]
# Bevy en sous-dossier du repo (tout poussé sur Miyukini_COG).
bevy = { path = "../../bevy", default-features = false, features = ["2d"] }

[[bin]]
name = "allumina"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
