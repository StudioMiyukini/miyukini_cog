# @id: kindmother_service_crate_config
# @do: declare_kindmother_service_crate
# @layer: core
# Crate KindMother Service — Serveur libSQL isolé, seul interlocuteur de la DB.

[package]
name = "kindmother-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["kindmother", "libsql", "database", "encryption"]
categories.workspace = true
description = "KindMother Service — Serveur de persistance libSQL isolé et chiffré"

[dependencies]
# Core Miyukini
miyukini-kernel = { path = "../miyukini-kernel" }
kindmother = { path = "../kindmother" }

# SQLite via rusqlite (compatible bundled, pas besoin de compilateur C externe)
rusqlite = { version = "0.32", features = ["bundled"] }

# Sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# IPC - JSON over TCP (simple, pas de dépendance protoc)
# tonic et prost retirés car nécessitent protoc

# Sécurité
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }

# Utilitaires
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[[bin]]
name = "kindmother-server"
path = "src/bin/kindmother_server.rs"

# Pas de build dependencies nécessaires sans gRPC

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
