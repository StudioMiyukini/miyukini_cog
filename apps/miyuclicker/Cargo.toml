# MiyuClicker (Lord of the Click) — App standalone (lancée par Central ou indépendamment).

[package]
name = "miyuclicker-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lord of the Click — Idle/Clicker + Carte stratégique (standalone)"

[dependencies]
miyuclicker = { path = "../../crates/miyuclicker" }
miyukini-service-ui = { path = "../../crates/miyukini-service-ui" }
dioxus = { version = "0.6", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "miyuclicker_app"
path = "src/lib.rs"

[[bin]]
name = "miyuclicker"
path = "src/main.rs"

[lints]
workspace = true
