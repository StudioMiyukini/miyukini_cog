[package]
name = "miyualicia-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Serveur API REST JWT — Alicia Home Assistante. Routes, auth HS256, DTOs, handlers, rate limit."

[dependencies]
miyualicia            = { path = "../miyualicia" }
miyualicia-devices    = { path = "../miyualicia-devices" }
miyualicia-skills     = { path = "../miyualicia-skills" }
miyualicia-memory     = { path = "../miyualicia-memory" }
miyualicia-dispatcher = { path = "../miyualicia-dispatcher" }

axum               = "0.8"
tower              = { version = "0.5", features = ["util"] }
tower-http         = { version = "0.6", features = ["cors", "trace", "limit"] }
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
jsonwebtoken       = "9"
chrono             = { version = "0.4", features = ["serde"] }
uuid               = { version = "1", features = ["v4", "serde"] }
thiserror          = "2"
tracing            = "0.1"
# Verification client_id/secret -> JWT (`/auth/token`) : secret partage, desactive
# par defaut (lot 2, point #23) ; voir la feature `jeton-secret-client`.
argon2             = { version = "0.5", optional = true }

[features]
default = []
# Retablit `POST /auth/token` (client_id + secret -> JWT HS256). Secret partage :
# hors de la sortie du lot 2, a remplacer par passeport de service + PoP.
jeton-secret-client = ["dep:argon2"]

[dev-dependencies]
# Tests uniquement : active le bypass de la gate cores (K-16).
miyualicia = { path = "../miyualicia", features = ["dev-bypass"] }
tokio          = { version = "1", features = ["full", "test-util"] }
http-body-util = "0.1"
argon2         = "0.5"
tempfile       = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
