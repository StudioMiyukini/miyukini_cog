[package]
name = "miyukini-central"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Miyukini Central - Hub de gestion des Services de l'ecosysteme Miyukini COG"

[dependencies]
dotenvy = "0.15"
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "persistence", "glow"] }
egui-phosphor = "0.9"
jayfestival = { path = "../jayfestival" }
miyuclicker = { path = "../miyuclicker" }
lord_of_the_castle = { path = "../lord_of_the_castle" }
resvg = { version = "0.46", default-features = false }
usvg = { version = "0.46", default-features = false }
tiny-skia = "0.11"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "miyukini-central"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
