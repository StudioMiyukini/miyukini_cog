# Crate vendue pour Miyukini : démos egui (sidebar + tous les outils).
# Source : deps/egui/crates/egui_demo_lib, adaptée pour egui 0.33 (crates.io).
# Voir docs/tools/MiyukiniEguiEditor - Adaptation Demo egui.md

[package]
name = "egui_demos_miyukini"
version = "0.1.0"
edition = "2021"
description = "Démos egui adaptées pour Miyukini UI Editor (egui 0.33 crates.io)"
license = "MIT OR Apache-2.0"

[features]
default = []
chrono = ["egui_extras/datepicker", "dep:chrono"]
serde = ["egui/serde", "dep:serde", "egui_extras/serde"]
syntect = ["egui_extras/syntect"]

[dependencies]
egui = { version = "0.33", default-features = false, features = ["color-hex"] }
egui_extras = { version = "0.33", default-features = false, features = ["image", "svg"] }
unicode_names2 = { version = "2.0", default-features = false }
chrono = { version = "0.4", optional = true, default-features = false }
serde = { version = "1.0", optional = true, features = ["derive"] }
