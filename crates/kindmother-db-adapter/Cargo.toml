# @id: kindmother_db_adapter_crate_config
# @do: declare_kindmother_db_adapter_crate_dependencies
# @layer: infra
# Crate kindmother-db-adapter — Utilitaires communs pour les services KindMother.
# Fonctions pures : timestamps, UUID, conversions bool/int, hash SHA-256.

[package]
name = "kindmother-db-adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["kindmother", "database", "adapter"]
categories.workspace = true
description = "Utilitaires communs pour les services KindMother (timestamps, UUID, conversions)"

[features]
default = []

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chrono = "0.4"
getrandom = "0.2"
sha2 = "0.10"
subtle = "2.5"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
