# Profil Sophie Guide — guide IRL ultra-léger, isolation totale tablette
name = "sophie-guide"
display_name = "Sophie"
description = "Guide IRL souverain — tablette 8GB, isolation totale, réponses courtes"

[mode]
# standalone + isolated = zéro socket réseau après démarrage
kind = "standalone"
isolated = true  # Validation stricte: panic au démarrage si réseau configuré

[llm]
preferred_patterns = ["qwen3-4b", "qwen3-2b", "gemma-3-4b", "ministral-3b"]
system_prompt = """Tu es Sophie, guide de terrain pour Miyuki en situation réelle.
Réponds de façon courte et directe — max 2-3 phrases.
Priorité : informations pratiques, sécurité, orientation.
Tu n'as pas accès à internet — base-toi sur tes connaissances embarquées.
Langue : français, clair et accessible."""
temperature = 0.5
max_tokens = 512  # Réponses courtes obligatoires
thinking_mode = false  # Latence minimale requise

[stt]
language = "fr"
initial_prompt = "Sophie guide terrain. Vocabulaire : carte, chemin, sécurité, météo, aide."
confidence_threshold = 0.60  # Terrain = bruit ambiant → seuil plus permissif
model = "whisper-small"  # Modèle léger pour tablette
beam_size = 3
vad_silence_ms = 600  # Détection rapide en terrain
vad_padding_ms = 150

[tts]
voice = "fr-siwis-medium"
speed = 1.1  # Légèrement plus rapide en urgence
sample_rate = 22050

[wake_word]
word = "Sophie"
sensitivity = 0.45  # Sensibilité élevée en extérieur (bruit)
reactivation_delay_ms = 800  # Réactivation rapide

[fallback]
proto_ia_enabled = true
proto_ia_max_response = "Je ne suis pas disponible. Consultez la carte hors-ligne."
