# CI du workspace COG — lot 0, constat R-005 (contraintes C-03, C-04, C-05).
name: cog-ci

on:
  push:
    branches:
      - main
      - "mscm/**"
      - "feat/**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: dépendances système (GTK, WebKit, ALSA, clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libxdo-dev \
            libssl-dev clang pkg-config
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # maia-llm exige CUDA : construit hors CI.
      - name: build
        run: cargo build --workspace --exclude maia-llm --locked
      - name: tests
        run: cargo test --workspace --exclude maia-llm --locked

  clippy-securite:
    # C-03 : -D warnings sur les crates de sécurité ; la liste s'étend à chaque crate mise au propre.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev clang pkg-config
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: clippy crates sécurité
        run: cargo clippy --locked -p miyusceau -- -D warnings

  regles-depot:
    # Lot C (K-13, C-32) : rusqlite réservé à kindmother-service (liste transitoire datée).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: rusqlite réservé à KindMother
        run: bash scripts/verifier-regle-rusqlite.sh

  dependances:
    # C-04 / EX-15 : vulnérabilités, licences, sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses sources bans
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          toolchain: 1.99.0
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
