[package]
name = "miyudouane"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Douane — pare-feu nftables et IPS maison appliquant les arrêtés de BorderGuard, une instance par frontière ; rendu des zones (namespaces, veth, nftables, sandboxes systemd)"

# Aucune dépendance réseau ni GPL (C-71) : génération pure en Rust, application
# explicite par la CLI (`--appliquer`) seulement.
[dependencies]
borderguard = { path = "../borderguard" }
miyusceau = { path = "../miyusceau" }

[[bin]]
name = "miyudouane"
path = "src/bin/miyudouane.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
too_many_lines = "allow"
