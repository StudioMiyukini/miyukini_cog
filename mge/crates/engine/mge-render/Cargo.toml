# @id: MGE-Render @do: engine @role: back-end @layer: 2 @human: miyuk
# mge-render -- MGE renderer: wgpu sprite batching, iso tilemap, dual-res

[package]
name = "mge-render"
version.workspace = true
edition.workspace = true
description = "MGE renderer: wgpu sprite batching, iso tilemap, dual-res"

[dependencies]
wgpu = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
bytemuck = { version = "1.16", features = ["derive"] }
mge-math = { path = "../../kernel/mge-math" }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["dual-res", "instanced"]
dual-res = []
post-process = []
instanced = []
legacy-batcher = []

[lints]
workspace = true
