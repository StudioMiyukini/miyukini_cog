# @id: jaycloud_migrate_crate_config
# @do: declare_jaycloud_migrate_crate
# @layer: 7
# @human: Crate jaycloud-migrate — binaire one-shot de migration MiyuCloud → JayCloud (rapatriement de l'arborescence + redirection 308 des liens publics).

[package]
name = "jaycloud-migrate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Outil one-shot de migration MiyuCloud → JayCloud : inventaire de l'arborescence, hash + chiffrement vers le CAS, import comme premier snapshot full, génération des entrées miyucloud_redirects pour la rétrocompatibilité des liens publics."

[[bin]]
name = "jaycloud-migrate"
path = "src/main.rs"

[dependencies]
jaycloud    = { path = "../jaycloud" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
thiserror   = "2"
tracing     = "0.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
items_after_statements = "allow"
