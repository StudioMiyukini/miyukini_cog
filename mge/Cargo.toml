[workspace]
resolver = "2"
default-members = ["games/sodomight"]
members = [
  "crates/mge-audio",
  "crates/mge-content",
  "crates/mge-core",
  "crates/mge-input",
  "crates/mge-nav",
  "crates/mge-net",
  "crates/mge-proto",
  "crates/mge-render",
  "crates/mge-replication",
  "crates/mge-save",
  "crates/mge-server-core",
  "crates/mge-gameplay",
  "crates/mge-items",
  "crates/mge-world",
  "crates/mge-monsters",
  "crates/mge-meta",
  "crates/mge-ui",
  "games/sodomight",
  "tools/mge-asset-baker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["Miyukini Contributors"]

[workspace.dependencies]
anyhow = "1.0.102"
kira = "0.12.0"
pollster = "0.4.0"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
wgpu = "28.0.0"
winit = "0.30.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
