# Cibles de fuzzing de miyucdr (EX-10, C-26) — cargo-fuzz, nightly.
# Hors du workspace (table [workspace] propre) : les builds normaux l'ignorent.
# Lancement : cd crates/miyucdr/fuzz && cargo +nightly fuzz run desarmer_texte
# Corpus initial : cargo run --example generer_graines (stable) → seeds/<cible>/.
[package]
name = "miyucdr-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
miyucdr = { path = ".." }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "desarmer_image"
path = "fuzz_targets/desarmer_image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "desarmer_texte"
path = "fuzz_targets/desarmer_texte.rs"
test = false
doc = false
bench = false
