[package]
name = "mini-cms"
version = "0.1.0"
edition = "2021"
description = "Produit pilote pour valider la Phase 0 du SPM CMS - Modules Contenu, Hiérarchie, Taxonomies"

[[bin]]
name = "mini-cms"
path = "src/main.rs"

[dependencies]
miyukini-kernel = { path = "../miyukini-kernel" }
miyukini-spm-cms-content = { path = "../miyukini-spm-cms-content", features = ["memory"] }
miyukini-spm-cms-hierarchy = { path = "../miyukini-spm-cms-hierarchy", features = ["memory"] }
miyukini-spm-cms-taxonomies = { path = "../miyukini-spm-cms-taxonomies", features = ["memory"] }
