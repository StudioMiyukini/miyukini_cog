[package]
name = "allumina_prototype"
version = "0.1.0"
edition = "2021"
description = "Allumina MVP — Sandbox RPG solo (MGE)"

[[bin]]
name = "allumina_prototype"
path = "src/main.rs"

[dependencies]
# Fenêtre et rendu
winit = "0.29"
wgpu = "24"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
# Erreurs
anyhow = "1"
# Logs
env_logger = "0.10"
log = "0.4"
# Utilitaires
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
# MGE
mge-core = { path = "../../crates/mge-core" }
mge-ecs = { path = "../../crates/mge-ecs" }
mge-event = { path = "../../crates/mge-event" }
mge-rng = { path = "../../crates/mge-rng" }
mge-plugin-spatial = { path = "../../crates/mge-plugin-spatial" }
