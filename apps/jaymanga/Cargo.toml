# JayManga — App standalone (lancée par Central ou indépendamment).

[package]
name = "jaymanga-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "JayManga — Lecture et vente de manga en ligne (standalone)"

[dependencies]
jaymanga = { path = "../../crates/jaymanga" }
kindmother = { path = "../../crates/kindmother" }
miyukini-service-ui = { path = "../../crates/miyukini-service-ui" }
dioxus = { version = "0.6", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "jaymanga"
path = "src/main.rs"

[lints]
workspace = true
