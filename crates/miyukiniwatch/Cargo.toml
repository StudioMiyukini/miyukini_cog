# MiyukiniWatch — Service silencieux de mesure des habitudes.
# Alimente Miou (avatar/mascotte) pour bulles, rappels et suggestions.
# Aucune dépendance réseau. Données strictement locales.

[package]
name = "miyukiniwatch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["miyukiniwatch", "metrics", "habits", "miou", "usage"]
categories.workspace = true
description = "MiyukiniWatch — Service silencieux de mesure des habitudes au service de Miou"

[dependencies]
kindmother = { path = "../kindmother" }
kindmother-db-key = { path = "../kindmother-db-key", optional = true }
# HÉRITÉ (transitoire, K-13) : accès SQLite direct, uniquement avec la feature `legacy-sqlite`.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# Persistance KindMother (K-13 : KindMother seul écrivain ; EX-07 : écritures par intentions typées).
kindmother-client = { path = "../kindmother-client", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
# Serveur KindMother éphémère en processus (tests du chemin KindMother).
kindmother-service = { path = "../kindmother-service" }
tempfile = "3"

[features]
# Défaut : persistance via le service KindMother (seul écrivain).
default = ["kindmother-only"]
kindmother-only = ["dep:kindmother-client", "dep:tokio"]
# HÉRITÉ (transitoire, K-13) : SQLite local direct ; prioritaire s'il est activé explicitement.
legacy-sqlite = ["dep:rusqlite"]
# Chiffrement SQLCipher : n'a de sens qu'avec le chemin hérité.
db-encryption = ["legacy-sqlite", "dep:kindmother-db-key", "rusqlite/bundled-sqlcipher"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
