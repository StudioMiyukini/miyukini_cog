# @id: MGE-Workspace @do: workspace-root @role: build @layer: 0 @human: miyuk
# Miyukini Game Engine -- Workspace independant de COG

[workspace]
resolver = "2"
members = [
    # === Couche 1 : Kernel (5 crates) ===
    "crates/kernel/mge-core",
    "crates/kernel/mge-ecs",
    "crates/kernel/mge-math",
    "crates/kernel/mge-asset",
    "crates/kernel/mge-platform",

    # === Couche 2 : Engine (9 crates) ===
    "crates/engine/mge-render",
    "crates/engine/mge-audio",
    "crates/engine/mge-ui",
    "crates/engine/mge-pathfinding",
    "crates/engine/mge-collision",
    "crates/engine/mge-collision-rich",
    "crates/engine/mge-script",
    "crates/engine/mge-net",
    "crates/engine/mge-save",

    # === Couche 3 : Pack ARPG (10 crates) ===
    "crates/arpg/mge-arpg-world",
    "crates/arpg/mge-arpg-entity",
    "crates/arpg/mge-arpg-combat",
    "crates/arpg/mge-arpg-items",
    "crates/arpg/mge-arpg-stats",
    "crates/arpg/mge-arpg-skills",
    "crates/arpg/mge-arpg-loot",
    "crates/arpg/mge-arpg-ai",
    "crates/arpg/mge-arpg-quest",
    "crates/arpg/mge-arpg-trade",

    # === Couche 4 : Game (3 crates) ===
    "games/sodomight",
    "games/sodomight-server",
    "games/sodomight-client",

    # === Outils (7 crates) ===
    "tools/mge-studio",
    "tools/mge-packer",
    "tools/mge-slicer",
    "tools/mge-rescale",
    "tools/mge-mirror",
    "tools/mge-remap",
    "tools/mge-anim-pack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Miyukini AI Studio"]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
manual_midpoint = "allow"

[workspace.dependencies]
# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Identifiants et temps
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Erreurs
thiserror = "2.0"

# Random
rand = "0.8"
rand_chacha = "0.3"

# Graphique
wgpu = "24.0"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }

# UI (egui)
egui = "0.28"
egui-wgpu = "0.28"
egui-winit = "0.28"

# UI tokens & adapters (cross-workspace)
miyuki-ui-tokens = { path = "../crates/miyuki-ui-tokens" }
miyuki-ui-egui = { path = "../crates/miyuki-ui-egui" }

# Audio
kira = "0.9"

# Hot-reload
notify = "7.0"

# Scripting
rhai = "1.20"

# Reseau
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "sync", "macros"] }

# Base de donnees
rusqlite = { version = "0.32", features = ["bundled"] }

# Securite — hashing mot de passe
argon2 = { version = "0.5", features = ["rand"] }
password-hash = { version = "0.5", features = ["getrandom"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Pathfinding (interne, pas de dep externe)
# Collision (interne, pas de dep externe)

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
