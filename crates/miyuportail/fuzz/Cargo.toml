# Cibles de fuzzing de miyuportail (EX-10, C-26) — cargo-fuzz, nightly.
# Hors du workspace (table [workspace] propre) : les builds normaux l'ignorent.
# Lancement : cd crates/miyuportail/fuzz && cargo +nightly fuzz run decoder_trame
# Corpus initial : cargo run --example generer_graines (stable) → seeds/<cible>/.
[package]
name = "miyuportail-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
miyuportail = { path = ".." }
ed25519-dalek = "2"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decoder_trame"
path = "fuzz_targets/decoder_trame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validation2"
path = "fuzz_targets/validation2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "requete_sas"
path = "fuzz_targets/requete_sas.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reponse_sas"
path = "fuzz_targets/reponse_sas.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cosignature"
path = "fuzz_targets/cosignature.rs"
test = false
doc = false
bench = false

[[bin]]
name = "portail"
path = "fuzz_targets/portail.rs"
test = false
doc = false
bench = false
