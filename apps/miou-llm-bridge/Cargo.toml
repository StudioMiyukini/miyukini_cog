# MAIA — Miyukini AI Agents — moteur IA local (STT/LLM/TTS/skills/personas).
# Anciennement miou-llm-bridge — renommé vers "maia" (S1-E01).
# Le répertoire physique reste apps/miou-llm-bridge jusqu'au prochain refactor git mv.

[package]
name = "maia"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MAIA — Miyukini AI Agents — moteur IA local (STT/LLM/TTS/skills/personas)"

[[bin]]
name = "maia"
path = "src/main.rs"

[features]
default = []

[dependencies]
# HTTP server
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "process"] }

# HTTP client (upstream backup : LM Studio / Ollama)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Sérialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Hardware detection
sysinfo = "0.33"

# Async recursion (file_ops)
async-recursion = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CORS & middleware
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["util"] }

# Audio output — TTS playback via Piper (S1-E06)
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }
hound = "3.5"

# Cryptographie (HMAC anti-MITM + AES-256-GCM chiffrement réponses)
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Identifiant de nœud TEAM (hostname)
hostname = "0.4"

[lints]
workspace = true
