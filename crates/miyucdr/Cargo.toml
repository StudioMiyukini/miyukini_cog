[package]
name = "miyucdr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Désarmement et reconstruction de contenu (CDR) : toute entrée de fichier est décodée puis réencodée, sinon refusée (EX-45)"

# Dépendances pur Rust, licences permissives (C-71, deny.toml) :
# - image (MIT OR Apache-2.0) : décodeurs png / zune-jpeg / gif / image-webp / bmp,
#   sans les fonctions par défaut (ni rayon, ni avif, ni tiff, ni exr…).
# - unicode-normalization (MIT OR Apache-2.0) : NFC.
# - serde_json (MIT OR Apache-2.0) : JSON analysé puis resérialisé.
# - thiserror (MIT OR Apache-2.0).
[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
unicode-normalization = "0.1"
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
