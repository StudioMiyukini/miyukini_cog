[package]
name = "jay-collab"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Jay Bureau — moteur de collaboration temps réel (Yrs CRDT + WebSocket)"

[dependencies]
# CRDT (Yjs pour Rust)
yrs = "0.21"

# Async + WebSocket
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Types partagés Jay Bureau
jaybureau-core = { path = "../jaybureau-core" }

# Logging
tracing = "0.1"

# Utils
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
