# Loopback par défaut. Hors loopback : auth_token obligatoire (sinon refus de démarrer).
bind_addr = "127.0.0.1:11435"
upstream_url = "http://localhost:1234"
log_requests = true

[native]
models_dir = "models"
prefer_native = true
gpu_layers = -1
context_size = 4096
threads = 0
auto_load = true

[security]
allowed_origins = []
# require_auth_all : non défini = auto (actif hors loopback, inactif en loopback).
# require_auth_all = true
# Proxys de confiance (IP/CIDR IPv4) autorisés à fournir X-Forwarded-For. Vide = jamais.
trusted_proxies = []
# Origines CORS explicites (ex: ["http://localhost:3000"]). Vide = pas de CORS cross-origin.
cors_allowed_origins = []
strict_user_agent = false
hmac_max_age_secs = 300
admin_origins = []
