# @id: kindmother_service_crate_config
# @do: declare_kindmother_service_crate
# @layer: core
# Crate KindMother Service — Serveur libSQL isolé, seul interlocuteur de la DB.

[package]
name = "kindmother-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["kindmother", "libsql", "database", "encryption"]
categories.workspace = true
description = "KindMother Service — Serveur de persistance libSQL isolé et chiffré"

[dependencies]
# Core Miyukini
miyukini-kernel = { path = "../miyukini-kernel" }
kindmother = { path = "../kindmother" }
kindmother-db-key = { path = "../kindmother-db-key", optional = true }

# SQLite : SQLCipher par défaut (feature db-encryption, K-06) ; requiert libcrypto (OpenSSL)
# à la compilation. Attention à l'unification des features : tout build du graphe qui inclut
# kindmother-service avec ses features par défaut passe *tous* les rusqlite en SQLCipher
# (sans clé, SQLCipher se comporte comme SQLite : les autres crates restent compatibles).
# `hooks` : autorisateur SQLite (sqlite3_set_authorizer) pour l'arbitrage SQL (K-05)
rusqlite = { version = "0.32", features = ["bundled", "hooks"], default-features = false }

# Sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# IPC - JSON over TCP (simple, pas de dépendance protoc)
# tonic et prost retirés car nécessitent protoc

# Utilitaires
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"

# Authentification des opérateurs (K-04) : signature Ed25519 sur un défi serveur.
# Primitives autorisées par C-24 (ed25519-dalek, rand_core::OsRng) ; zeroize pour C-25.
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[dev-dependencies]
kindmother-client = { path = "../kindmother-client" }

[features]
# Chiffrement par défaut (K-06) : sans cette feature, le service refuse de démarrer, sauf
# build de debug avec KINDMOTHER_DEV_PLAINTEXT=1 (développement uniquement).
default = ["db-encryption"]
db-encryption = ["dep:kindmother-db-key", "rusqlite/bundled-sqlcipher"]

[[bin]]
name = "kindmother-server"
path = "src/bin/kindmother_server.rs"

# Pas de build dependencies nécessaires sans gRPC

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
