<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>MiyuCloud - Fichier partage</title>
    <link rel="stylesheet" href="/share/static/style.css">
</head>
<body>
    <div class="container" role="main">
        <!-- Header -->
        <header class="header">
            <div class="logo" aria-label="Miyukini">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                    <circle cx="14" cy="14" r="13" stroke="#7c3aed" stroke-width="2" fill="none"/>
                    <path d="M9 14 C9 10, 14 7, 14 7 C14 7, 19 10, 19 14 C19 18, 14 21, 14 21 C14 21, 9 18, 9 14Z" fill="#7c3aed" opacity="0.7"/>
                    <circle cx="14" cy="13" r="3" fill="#a78bfa"/>
                </svg>
                <span class="logo-text">MiyuCloud</span>
            </div>
        </header>

        <!-- State: Download available -->
        <main id="state-available" class="card hidden" role="region" aria-label="Fichier disponible au telechargement">
            <div class="file-icon" aria-hidden="true">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect x="8" y="4" width="32" height="40" rx="4" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
                    <path d="M8 14h32" stroke="#6b7280" stroke-width="1"/>
                    <rect x="14" y="20" width="20" height="2" rx="1" fill="#4b5563"/>
                    <rect x="14" y="26" width="16" height="2" rx="1" fill="#4b5563"/>
                    <rect x="14" y="32" width="12" height="2" rx="1" fill="#4b5563"/>
                </svg>
            </div>
            <h1 id="file-name" class="file-name">Chargement...</h1>
            <p id="file-size" class="file-size"></p>
            <p id="file-expires" class="file-expires"></p>

            <!-- Password form (hidden by default) -->
            <form id="password-form" class="password-form hidden" aria-label="Formulaire de mot de passe">
                <label for="password-input" class="password-label">Ce fichier est protege par un mot de passe</label>
                <div class="password-row">
                    <input
                        id="password-input"
                        type="password"
                        class="password-input"
                        placeholder="Entrer le mot de passe..."
                        autocomplete="off"
                        required
                        aria-required="true"
                        aria-describedby="password-error"
                    >
                    <button
                        id="password-submit"
                        type="submit"
                        class="btn btn-secondary"
                        aria-label="Valider le mot de passe"
                    >Valider</button>
                </div>
                <p id="password-error" class="error-text hidden" role="alert"></p>
            </form>

            <!-- Download button -->
            <button
                id="download-btn"
                class="btn btn-primary"
                aria-label="Telecharger le fichier"
            >
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                    <path d="M9 2v10M9 12l-4-4M9 12l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 14h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Telecharger
            </button>

            <p id="download-count" class="download-count hidden"></p>
        </main>

        <!-- State: Password required (initial gate) -->
        <main id="state-password" class="card hidden" role="region" aria-label="Mot de passe requis">
            <div class="lock-icon" aria-hidden="true">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect x="12" y="20" width="24" height="22" rx="4" fill="#374151" stroke="#7c3aed" stroke-width="2"/>
                    <path d="M16 20V14a8 8 0 1 1 16 0v6" stroke="#7c3aed" stroke-width="2" fill="none"/>
                    <circle cx="24" cy="31" r="3" fill="#a78bfa"/>
                    <path d="M24 34v4" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="file-name">Fichier protege</h1>
            <p class="file-size">Entrez le mot de passe pour acceder au fichier.</p>
            <form id="gate-password-form" class="password-form" aria-label="Formulaire d'authentification">
                <div class="password-row">
                    <input
                        id="gate-password-input"
                        type="password"
                        class="password-input"
                        placeholder="Mot de passe..."
                        autocomplete="off"
                        required
                        aria-required="true"
                        aria-describedby="gate-password-error"
                    >
                    <button
                        id="gate-password-submit"
                        type="submit"
                        class="btn btn-primary"
                        aria-label="Acceder au fichier"
                    >Acceder</button>
                </div>
                <p id="gate-password-error" class="error-text hidden" role="alert"></p>
            </form>
        </main>

        <!-- State: Expired or revoked -->
        <main id="state-expired" class="card hidden" role="region" aria-label="Lien expire ou revoque">
            <div class="expired-icon" aria-hidden="true">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="18" stroke="#ef4444" stroke-width="2" fill="none"/>
                    <path d="M16 16l16 16M32 16L16 32" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="file-name">Lien indisponible</h1>
            <p id="expired-message" class="file-size">
                Ce lien de partage a expire ou a ete revoque.
            </p>
        </main>

        <!-- State: Loading -->
        <main id="state-loading" class="card" role="region" aria-label="Chargement">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p class="file-size">Chargement...</p>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Partage securise via MiyuCloud &mdash; Miyukini COG</p>
        </footer>
    </div>

    <script src="/share/static/download.js"></script>
</body>
</html>
