[package]
name = "miyucloud-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MiyuCloud Server -- API REST + Surface web de partage securise"

[dependencies]
miyucloud = { path = "../../crates/miyucloud", features = ["legacy-sqlite"] }
miyucloud-dav = { path = "../../crates/miyucloud-dav" }
rusqlite = { version = "0.32", features = ["bundled"] }
miyukini-central = { path = "../../crates/miyukini-central", features = ["legacy-sqlite"] }
miyukini-connect = { path = "../../crates/miyukini-connect" }
miyukini-kernel = { path = "../../crates/miyukini-kernel" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
wildcard_imports = "allow"
needless_pass_by_value = "allow"
unused_async = "allow"
