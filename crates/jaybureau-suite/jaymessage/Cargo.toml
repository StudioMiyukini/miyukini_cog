[package]
name = "jaymessage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Jay Message — messagerie chiffrée de bout en bout (Signal-like)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"

# Crypto (crates éprouvées uniquement, C-24) — le handshake n'utilise plus
# `miyukini_cog_bridge::e2e` (clé éphémère non signée, dérivation maison, R-009)
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"
rand = "0.8"

[lints]
workspace = true
