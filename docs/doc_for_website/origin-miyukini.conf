limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

server {
    listen 80;
    server_name 46.202.129.65 miyukini.com origin.miyukini.com;
    
    location /.well-known/acme-challenge/ { 
        root /var/www/html; 
    }

    location / { 
        return 301 https://$host$request_uri; 
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 46.202.129.65 miyukini.com origin.miyukini.com;
    
    ssl_certificate     /etc/miyukini/tls/origin.crt;
    ssl_certificate_key /etc/miyukini/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Documentation statique - PRIORITAIRE
    location /docs/ {
        alias /var/www/docs/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }
    
    location /docs {
        return 301 /docs/;
    }

    # Racine redirige vers la documentation
    location = / {
        return 301 /docs/;
    }

    # Admin panel
    location /admin {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=admin_login burst=5 nodelay;
    }

    # Service Origin (API, etc.) - tout le reste
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
