[package]
name = "jay-sheets"
version = "0.1.0"
edition = "2021"
description = "Jay Sheets — tableur collaboratif"
authors = ["Miyukini Contributors"]
license = "LicenseRef-Miyukini-Dual"

[[bin]]
name = "jay-sheets"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.5", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"

jaybureau-core = { path = "../../crates/jaybureau-core" }
jay-collab = { path = "../../crates/jay-collab" }

[lints]
workspace = true
