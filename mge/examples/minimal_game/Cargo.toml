[package]
name = "minimal_game"
version = "0.1.0"
edition = "2021"
description = "MGE Example — Kernel + spatial + input + render-2d (2D controllable)"

[[bin]]
name = "minimal_game"
path = "src/main.rs"

[dependencies]
mge-core = { path = "../../crates/mge-core" }
mge-plugin-spatial = { path = "../../crates/mge-plugin-spatial" }
mge-plugin-input = { path = "../../crates/mge-plugin-input" }
mge-plugin-render-2d = { path = "../../crates/mge-plugin-render-2d" }
mge-plugin-basic-physics = { path = "../../crates/mge-plugin-basic-physics" }
