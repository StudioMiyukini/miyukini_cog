[package]
name = "jaykonta"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["jaykonta", "accounting", "budget", "tauri"]
categories.workspace = true
description = "JayKonta - comptabilite COG unifiee Purse + Account"

[dependencies]
kindmother = { path = "../kindmother" }
kindmother-client = { path = "../kindmother-client" }
# rusqlite conservé temporairement pour migration progressive
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"

[features]
default = ["legacy-sqlite"]
# Mode legacy: accès SQLite direct (migration progressive)
legacy-sqlite = ["rusqlite"]
# Mode production: accès via KindMother uniquement
kindmother-only = []

# Note: eGUI supprimé — migration vers Tauri + React/TypeScript
# Voir docs/implementation/Miyukini - Plan Migration Tauri React TypeScript.md

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
