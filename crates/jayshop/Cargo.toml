# @id: jayshop_crate_config
# @do: declare_jayshop_crate_and_dependencies
# @layer: infra
# Crate JayShop — Service officiel famille Jay (commerce, PoS, vente en ligne).
# Persistance via KindMother Client → KindMother Service → libSQL chiffré.

[package]
name = "jayshop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["jayshop", "commerce", "pos", "tauri"]
categories.workspace = true
description = "JayShop — Service commerce, point de vente et vente en ligne"

[dependencies]
kindmother = { path = "../kindmother" }
kindmother-client = { path = "../kindmother-client" }
kindmother-db-adapter = { path = "../kindmother-db-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"

[features]
default = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
