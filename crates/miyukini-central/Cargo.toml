[package]
name = "miyukini-central"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Miyukini Central - Hub de gestion des Services de l'ecosysteme Miyukini COG"

# Binaire minimal (stub) — ne pas écraser miyukini-central.exe produit par apps/central
[[bin]]
name = "miyukini-central-stub"
path = "src/main.rs"

[dependencies]
kindmother = { path = "../kindmother" }
kindmother-client = { path = "../kindmother-client" }
chrono = "0.4"
dotenvy = "0.15"
jayfestival = { path = "../jayfestival" }
jaykoa = { path = "../jaykoa" }
jayxpose = { path = "../jayxpose" }
jaykonta = { path = "../jaykonta" }
lord_of_the_castle = { path = "../lord_of_the_castle" }
miyuclicker = { path = "../miyuclicker" }
# rusqlite conservé temporairement pour migration progressive
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"
base64 = "0.22"

[features]
default = ["legacy-sqlite"]
# Mode legacy: accès SQLite direct (migration progressive)
legacy-sqlite = ["rusqlite"]
# Mode production: accès via KindMother uniquement
kindmother-only = []

# Note: eGUI supprimé — migration vers Tauri + React/TypeScript
# Voir docs/implementation/Miyukini - Plan Migration Tauri React TypeScript.md

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
