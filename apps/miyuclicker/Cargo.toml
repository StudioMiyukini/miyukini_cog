[package]
name = "miyuclicker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "LicenseRef-Miyukini-Dual"
description = "Lord of the Click — Premier jeu officiel Miyukini (Idle/Clicker + Carte stratégique)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Note: eGUI supprimé — migration vers Tauri + React/TypeScript
# Voir docs/implementation/Miyukini - Plan Migration Tauri React TypeScript.md

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
