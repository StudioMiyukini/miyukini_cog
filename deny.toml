# cargo-deny — contraintes C-04, C-70, C-71 (docs/implementation/CONTRAINTES-IMPLEMENTATION.md)

[graph]
all-features = false

[advisories]
# Vulnérabilités connues (RustSec) : bloquantes ; paquets retirés : bloquants.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# C-71 : licences permissives uniquement, aucun code GPL.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Doublons de versions : signalés pour réduction progressive, pas bloquants.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io uniquement ; toute autre source doit être ajoutée ici et justifiée (C-70).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
