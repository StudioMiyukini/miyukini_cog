[package]
name = "miyukini-origin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "LicenseRef-Miyukini-Dual"
repository.workspace = true
description = "Miyukini Webway System Origin - Point central de vérité MWS (relay + tracker + registre)"

[[bin]]
name = "miyukini-origin"
path = "src/main.rs"

[dependencies]
# Miyukini ecosystem
miyukini-kernel = { path = "../../crates/miyukini-kernel" }
miyuwebway_tracker = { path = "../../crates/miyuwebway_tracker" }
miyuwebway_participant = { path = "../../crates/miyuwebway_participant" }
jayxpose = { path = "../../crates/jayxpose" }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# TLS
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2"
webpki-roots = "0.26"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Crypto
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand = "0.8"
argon2 = { version = "0.5", features = ["password-hash"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utils
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.5"
uuid = { version = "1.7", features = ["v4", "serde"] }
hex = "0.4"
urlencoding = "2.1"

[dev-dependencies]
tokio-test = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
